<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detail suroviny (Material Detail) — Exported from UXMagic Copilot">
    <title>Detail suroviny (Material Detail)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Poppins:wght@100..900&amp;family=Fira+Code:wght@300..700&amp;family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @import "tailwindcss";
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-tertiary: var(--tertiary);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --font-family-sans: var(--font-sans);
        --font-family-heading: var(--font-heading);
      }
      :root {
        --card: #ffffff;
        --border: #e2e8f0;
        --tertiary: #f59e0b;
        --foreground: #0f172a;
        --background: #f8fafc;
        --primary: #059669;
        --radius: 0.75rem;
        --ring: #10b981;
        --secondary: #f1f5f9;
        --input: #f1f5f9;
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div data-page="detail-suroviny-material-detail">

<div class="min-h-screen w-full bg-background flex flex-col relative font-sans text-foreground">
  <!-- Header -->
  <header class="bg-card border-b border-border px-4 py-3 sticky top-0 z-10 flex items-center gap-4">
    <button class="p-2 -ml-2 text-muted-foreground hover:text-foreground">
      <iconify-icon icon="lucide:arrow-left" class="text-2xl"></iconify-icon>
    </button>
    <h1 class="text-lg font-heading font-bold">Detail suroviny</h1>
  </header>

  <!-- Main Content -->
  <main class="flex-1 p-4 space-y-6 max-h-[800px] overflow-y-auto">
    <!-- Summary Section -->
    <section class="bg-primary text-primary-foreground rounded-2xl p-6 shadow-lg shadow-primary/20 relative overflow-hidden">
      <iconify-icon icon="lucide:flame" class="absolute -right-4 -bottom-4 text-8xl opacity-10"></iconify-icon>
      <div class="relative z-10 space-y-4">
        <div>
          <h2 class="text-2xl font-black">Měsíček lékařský</h2>
          <p class="text-primary-foreground/80 text-sm font-medium">Celkové skladové zásoby</p>
        </div>
        <div class="text-4xl font-black">33.2 <span class="text-xl font-bold opacity-80">kg</span></div>
        
        <div class="grid grid-cols-3 gap-2 pt-2">
          <div class="bg-white/10 backdrop-blur-sm rounded-lg p-2 text-center">
            <span class="block text-lg font-bold leading-none">3</span>
            <span class="text-[10px] opacity-80 uppercase font-bold">Packy</span>
          </div>
          <div class="bg-tertiary/20 backdrop-blur-sm rounded-lg p-2 text-center border border-tertiary/30">
            <span class="block text-lg font-bold leading-none text-tertiary">1</span>
            <span class="text-[10px] text-tertiary uppercase font-bold">Prázdný</span>
          </div>
          <div class="bg-orange-500/20 backdrop-blur-sm rounded-lg p-2 text-center border border-orange-500/30">
            <span class="block text-lg font-bold leading-none text-orange-200">1</span>
            <span class="text-[10px] text-orange-200 uppercase font-bold">Expiruje</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Pack List -->
    <section class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h3 class="text-xs font-bold uppercase tracking-wider text-muted-foreground">Seznam packů</h3>
        <button class="text-xs font-bold text-primary flex items-center gap-1">
          <iconify-icon icon="lucide:plus"></iconify-icon> Přidat nový
        </button>
      </div>
      
      <div class="space-y-3">
        <!-- Pack 1 -->
        <div class="bg-card border border-border p-4 rounded-xl shadow-sm flex items-center justify-between active:bg-secondary transition-colors">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-lg bg-secondary flex flex-col items-center justify-center font-mono font-bold text-xs">
              <span class="text-muted-foreground opacity-50">ID</span>
              <span>Z3R4</span>
            </div>
            <div>
              <p class="text-sm font-bold">0.8 kg</p>
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold text-tertiary">Téměř prázdný</span>
                <span class="w-1 h-1 rounded-full bg-border"></span>
                <span class="text-[10px] text-muted-foreground">BOX-42</span>
              </div>
            </div>
          </div>
          <iconify-icon icon="lucide:chevron-right" class="text-muted-foreground"></iconify-icon>
        </div>

        <!-- Pack 2 -->
        <div class="bg-card border border-border p-4 rounded-xl shadow-sm flex items-center justify-between active:bg-secondary transition-colors">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-lg bg-secondary flex flex-col items-center justify-center font-mono font-bold text-xs">
              <span class="text-muted-foreground opacity-50">ID</span>
              <span>B7K2</span>
            </div>
            <div>
              <p class="text-sm font-bold">8.2 kg</p>
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold text-orange-500">Expiruje za 5 dní</span>
                <span class="w-1 h-1 rounded-full bg-border"></span>
                <span class="text-[10px] text-muted-foreground">BOX-42</span>
              </div>
            </div>
          </div>
          <iconify-icon icon="lucide:chevron-right" class="text-muted-foreground"></iconify-icon>
        </div>

        <!-- Pack 3 -->
        <div class="bg-card border border-border p-4 rounded-xl shadow-sm flex items-center justify-between active:bg-secondary transition-colors">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-lg bg-secondary flex flex-col items-center justify-center font-mono font-bold text-xs">
              <span class="text-muted-foreground opacity-50">ID</span>
              <span>C4M1</span>
            </div>
            <div>
              <p class="text-sm font-bold">25.0 kg</p>
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold text-primary">Skladem</span>
                <span class="w-1 h-1 rounded-full bg-border"></span>
                <span class="text-[10px] text-muted-foreground">BOX-42</span>
              </div>
            </div>
          </div>
          <iconify-icon icon="lucide:chevron-right" class="text-muted-foreground"></iconify-icon>
        </div>
      </div>
    </section>
  </main>
</div>

    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Historie (History) — Exported from UXMagic Copilot">
    <title>Historie (History)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Poppins:wght@100..900&amp;family=Fira+Code:wght@300..700&amp;family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @import "tailwindcss";
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-tertiary: var(--tertiary);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --font-family-sans: var(--font-sans);
        --font-family-heading: var(--font-heading);
      }
      :root {
        --card: #ffffff;
        --border: #e2e8f0;
        --tertiary: #f59e0b;
        --foreground: #0f172a;
        --background: #f8fafc;
        --primary: #059669;
        --radius: 0.75rem;
        --ring: #10b981;
        --secondary: #f1f5f9;
        --input: #f1f5f9;
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div data-page="historie-history">

<div class="min-h-screen w-full bg-background flex flex-col relative font-sans text-foreground">
  <!-- Header -->
  <header class="bg-card border-b border-border px-4 py-3 sticky top-0 z-10 space-y-3">
    <div class="flex items-center justify-between">
      <h1 class="text-lg font-heading font-bold">Historie pohybu</h1>
      <div class="flex gap-2">
        <button class="w-8 h-8 rounded-lg bg-secondary flex items-center justify-center text-muted-foreground">
          <iconify-icon icon="lucide:download" class="text-lg"></iconify-icon>
        </button>
        <button class="w-8 h-8 rounded-lg bg-secondary flex items-center justify-center text-muted-foreground">
          <iconify-icon icon="lucide:funnel" class="text-lg"></iconify-icon>
        </button>
      </div>
    </div>
    
    <!-- Filter Tabs -->
    <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar">
      <button class="whitespace-nowrap px-4 py-1.5 rounded-full bg-primary text-primary-foreground text-xs font-bold">Dnes</button>
      <button class="whitespace-nowrap px-4 py-1.5 rounded-full bg-secondary border border-border text-muted-foreground text-xs font-medium">Tento týden</button>
      <button class="whitespace-nowrap px-4 py-1.5 rounded-full bg-secondary border border-border text-muted-foreground text-xs font-medium">Tento měsíc</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-h-[800px] overflow-y-auto">
    <!-- Log Entry Group -->
    <div class="px-4 py-3 bg-secondary/30 border-b border-border">
      <span class="text-[10px] font-bold text-muted-foreground uppercase tracking-widest">Dnes, 14. Listopadu</span>
    </div>

    <div class="divide-y divide-border">
      <!-- Entry 1: Výdej -->
      <div class="p-4 flex gap-4 active:bg-secondary transition-colors">
        <div class="w-10 h-10 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center shrink-0">
          <iconify-icon icon="lucide:log-out" class="text-xl"></iconify-icon>
        </div>
        <div class="flex-1 space-y-1">
          <div class="flex justify-between items-start">
            <span class="text-sm font-bold">Výdej suroviny</span>
            <span class="text-[10px] text-muted-foreground font-medium">12:22</span>
          </div>
          <p class="text-xs text-muted-foreground">Měsíček lékařský • Pack <span class="font-mono font-bold text-foreground">Z3R4</span></p>
          <div class="flex items-center justify-between pt-1">
            <div class="flex items-center gap-1.5">
              <div class="w-4 h-4 rounded-full bg-secondary flex items-center justify-center">
                <iconify-icon icon="lucide:user" class="text-[10px]"></iconify-icon>
              </div>
              <span class="text-[10px] font-medium">Novák</span>
            </div>
            <span class="text-sm font-black text-destructive">-2.5 kg</span>
          </div>
        </div>
      </div>

      <!-- Entry 2: Přesun -->
      <div class="p-4 flex gap-4 active:bg-secondary transition-colors">
        <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center shrink-0">
          <iconify-icon icon="lucide:move" class="text-xl"></iconify-icon>
        </div>
        <div class="flex-1 space-y-1">
          <div class="flex justify-between items-start">
            <span class="text-sm font-bold">Přesun boxu</span>
            <span class="text-[10px] text-muted-foreground font-medium">10:41</span>
          </div>
          <p class="text-xs text-muted-foreground">Box <span class="font-bold text-foreground">BOX-42</span> • A12-3 → B05-1</p>
          <div class="flex items-center justify-between pt-1">
            <div class="flex items-center gap-1.5">
              <div class="w-4 h-4 rounded-full bg-secondary flex items-center justify-center">
                <iconify-icon icon="lucide:user" class="text-[10px]"></iconify-icon>
              </div>
              <span class="text-[10px] font-medium">Novák</span>
            </div>
            <span class="text-[10px] font-bold text-blue-600 uppercase">Dokončeno</span>
          </div>
        </div>
      </div>

      <!-- Entry 3: Příjem -->
      <div class="p-4 flex gap-4 active:bg-secondary transition-colors">
        <div class="w-10 h-10 rounded-full bg-green-100 text-green-600 flex items-center justify-center shrink-0">
          <iconify-icon icon="lucide:log-in" class="text-xl"></iconify-icon>
        </div>
        <div class="flex-1 space-y-1">
          <div class="flex justify-between items-start">
            <span class="text-sm font-bold">Nový příjem (Příjem)</span>
            <span class="text-[10px] text-muted-foreground font-medium">08:15</span>
          </div>
          <p class="text-xs text-muted-foreground">Heřmánek pravý • Pack <span class="font-mono font-bold text-foreground">X9P2</span></p>
          <div class="flex items-center justify-between pt-1">
            <div class="flex items-center gap-1.5">
              <div class="w-4 h-4 rounded-full bg-secondary flex items-center justify-center">
                <iconify-icon icon="lucide:user" class="text-[10px]"></iconify-icon>
              </div>
              <span class="text-[10px] font-medium">Systém</span>
            </div>
            <span class="text-sm font-black text-primary">+25.0 kg</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Export Actions -->
    <div class="p-6 grid grid-cols-2 gap-3">
      <button class="bg-card border border-border py-3 rounded-xl flex items-center justify-center gap-2 text-xs font-bold hover:bg-secondary transition-colors">
        <iconify-icon icon="lucide:file-text" class="text-lg text-primary"></iconify-icon>
        Export CSV
      </button>
      <button class="bg-card border border-border py-3 rounded-xl flex items-center justify-center gap-2 text-xs font-bold hover:bg-secondary transition-colors">
        <iconify-icon icon="lucide:file-spreadsheet" class="text-lg text-primary"></iconify-icon>
        Export Excel
      </button>
    </div>
  </main>

  <!-- Bottom Nav -->
  <nav class="bg-card border-t border-border px-6 py-2 flex justify-between items-center sticky bottom-0">
    <button class="flex flex-col items-center gap-1 text-muted-foreground">
      <iconify-icon icon="lucide:layout-dashboard" class="text-xl"></iconify-icon>
      <span class="text-[10px] font-medium">Domů</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-muted-foreground">
      <iconify-icon icon="lucide:grid-3x3" class="text-xl"></iconify-icon>
      <span class="text-[10px] font-medium">Sklad</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-primary">
      <iconify-icon icon="lucide:history" class="text-xl"></iconify-icon>
      <span class="text-[10px] font-bold">Historie</span>
    </button>
    <button class="flex flex-col items-center gap-1 text-muted-foreground">
      <iconify-icon icon="lucide:settings" class="text-xl"></iconify-icon>
      <span class="text-[10px] font-medium">Nastavení</span>
    </button>
  </nav>
</div>

    </div>
    <script src="script.js"></script>
</body>
</html>

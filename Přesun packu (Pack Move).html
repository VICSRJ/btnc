<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Přesun packu (Pack Move) — Exported from UXMagic Copilot">
    <title>Přesun packu (Pack Move)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Poppins:wght@100..900&amp;family=Fira+Code:wght@300..700&amp;family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @import "tailwindcss";
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-tertiary: var(--tertiary);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --font-family-sans: var(--font-sans);
        --font-family-heading: var(--font-heading);
      }
      :root {
        --card: #ffffff;
        --border: #e2e8f0;
        --tertiary: #f59e0b;
        --foreground: #0f172a;
        --background: #f8fafc;
        --primary: #059669;
        --radius: 0.75rem;
        --ring: #10b981;
        --secondary: #f1f5f9;
        --input: #f1f5f9;
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div data-page="p-esun-packu-pack-move">

<div class="min-h-screen w-full bg-background flex flex-col relative font-sans text-foreground">
  <!-- Header -->
  <header class="bg-card border-b border-border px-4 py-3 sticky top-0 z-10 flex items-center gap-4">
    <button class="p-2 -ml-2 text-muted-foreground hover:text-foreground">
      <iconify-icon icon="lucide:arrow-left" class="text-2xl"></iconify-icon>
    </button>
    <h1 class="text-lg font-heading font-bold">Přesun packu</h1>
  </header>

  <!-- Main Content -->
  <main class="flex-1 p-4 space-y-6 max-h-[800px] overflow-y-auto">
    <div class="space-y-5">
      <!-- Find Pack -->
      <div class="space-y-2">
        <label class="text-sm font-bold">Najít pack</label>
        <div class="relative">
          <iconify-icon icon="lucide:search" class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground"></iconify-icon>
          <input type="text" placeholder="Naskenujte nebo zadejte ID..." class="w-full bg-input border border-border rounded-xl py-3 pl-10 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all">
          <button class="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 bg-primary/10 text-primary rounded-lg">
            <iconify-icon icon="lucide:camera" class="text-lg"></iconify-icon>
          </button>
        </div>
      </div>

      <!-- Current Location -->
      <div class="bg-card border border-border rounded-xl p-4 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-[10px] text-muted-foreground uppercase block font-bold">Aktuální box</span>
          <span class="text-lg font-bold">BOX-42</span>
        </div>
        <div class="text-right">
          <span class="text-[10px] text-muted-foreground uppercase block font-bold">Pozice</span>
          <span class="text-sm font-medium">A12-3</span>
        </div>
      </div>

      <!-- Movement Indicator -->
      <div class="flex justify-center py-2">
        <div class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center">
          <iconify-icon icon="lucide:arrow-down" class="text-xl"></iconify-icon>
        </div>
      </div>

      <!-- New Box Selection -->
      <div class="space-y-2">
        <label class="text-sm font-bold">Nový box</label>
        <div class="relative">
          <select class="w-full bg-input border border-border rounded-xl py-4 px-4 text-lg font-bold appearance-none focus:outline-none focus:ring-2 focus:ring-primary/20">
            <option>BOX-15</option>
            <option>BOX-16</option>
            <option>BOX-17</option>
            <option>Volná pozice</option>
          </select>
          <iconify-icon icon="lucide:chevron-down" class="absolute right-4 top-1/2 -translate-y-1/2 text-muted-foreground pointer-events-none text-xl"></iconify-icon>
        </div>
      </div>

      <!-- Note -->
      <div class="space-y-2">
        <label class="text-sm font-bold">Poznámka</label>
        <textarea placeholder="Důvod přesunu..." class="w-full bg-input border border-border rounded-xl py-3 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 min-h-[100px]"></textarea>
      </div>
    </div>
  </main>

  <!-- Action Footer -->
  <footer class="p-4 bg-card border-t border-border sticky bottom-0">
    <button class="w-full bg-primary text-primary-foreground py-4 rounded-xl font-bold shadow-lg shadow-primary/20 flex items-center justify-center gap-2 active:scale-[0.98] transition-all">
      <iconify-icon icon="lucide:refresh-cw" class="text-xl"></iconify-icon>
      POTVRDIT PŘESUN
    </button>
  </footer>
</div>

    </div>
    <script src="script.js"></script>
</body>
</html>
